version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: nexuschat_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - nexuschat_net

  redis:
    image: redis:7-alpine
    container_name: nexuschat_redis
    ports:
      - "6379:6379"
    networks:
      - nexuschat_net

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: nexuschat_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/nexuschat
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_super_secret_jwt_key
      - JWT_REFRESH_SECRET=your_super_secret_refresh_key
      - CLIENT_URL=http://localhost:5173
      - GEMINI_API_KEY=${GEMINI_API_KEY} # Must be provided in .env
    depends_on:
      - mongodb
      - redis
    networks:
      - nexuschat_net

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    container_name: nexuschat_client
    ports:
      - "5173:80" # Map 5173 to nginx 80
    networks:
      - nexuschat_net

volumes:
  mongodb_data:

networks:
  nexuschat_net:
    driver: bridge
